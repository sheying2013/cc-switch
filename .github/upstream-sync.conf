# ============================================================================
# cc switch live —— 上游同步过滤清单
#
# 作用：把 farion1231/cc-switch 的更新合并进本仓库时，自动保留本仓库已有的
#       删减与定制（去掉 MCP / Skills / Prompt / 设置-认证 / 赞助与推广信息，
#       改名 cc switch live，上游更新源改指 sheying2013）。
#
# 格式（纯文本，`#` 开头为注释，空行忽略）：
#   [section]          section 类型
#   keep-deleted       del|keep-deleted|redact|brand|follow              默认动作
#   reason=...         说明（只用于生成报告，可为空）
#   path=...           一行一个路径或 glob（支持 * ? [] 与 **）
#
# 动作含义：
#   del            上游若带回该路径，直接删除。
#   keep-deleted   冲突时保留本仓库的删除结果（die-on-modify）。
#   redact         冲突时保留本仓库版本（本仓库对该文件做过删减/定制）。
#   brand          本仓库品牌改动，冲突时保留本仓库版本。
#   follow         跟随上游（本仓库不再保留自己的版本，用于将来「恢复上游实现」）。
# ============================================================================

